name: Greenlight
description: >-
  Greenlight is a family-focused financial technology company offering a debit
  card and mobile banking app built for parents, kids, and teens. The platform
  pairs parental controls, allowance and chore automation, savings goals, and
  investing (from $1) with financial-literacy education. Greenlight is a
  financial technology company, not a bank; banking services are provided
  through partner banks such as Community Federal Savings Bank. It is backed by
  a16z and Bond Capital. Greenlight publishes no public developer API or
  developer portal; this profile captures the company's public identity,
  security/compliance posture, and trust surface.
